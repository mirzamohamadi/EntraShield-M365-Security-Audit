name: PowerShell Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run PowerShell syntax check
        shell: pwsh
        run: |
          Get-ChildItem -Path ./src -Filter *.ps1 -Recurse | ForEach-Object {
            $errors = $null
            $null = [System.Management.Automation.PSParser]::Tokenize((Get-Content $_.FullName -Raw), [ref]$errors)
            if ($errors) { throw $errors }
            Write-Host "Parsed $($_.FullName)"
          }
