name: PowerShell Tests

on:
  push:
    branches: [ main, 'feature/**', 'fix/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show PowerShell version
        shell: pwsh
        run: $PSVersionTable

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run PowerShell parser check
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path ./src -Include *.ps1,*.psm1 -Recurse | ForEach-Object {
            $errors = $null
            $null = [System.Management.Automation.PSParser]::Tokenize((Get-Content $_.FullName -Raw), [ref]$errors)
            if ($errors) {
              $failed = $true
              Write-Error "Parser errors in $($_.FullName): $errors"
            }
            else {
              Write-Host "Parsed $($_.FullName)"
            }
          }
          if ($failed) { exit 1 }

      - name: Run Pester tests
        shell: pwsh
        run: |
          Invoke-Pester -Path ./tests -CI
